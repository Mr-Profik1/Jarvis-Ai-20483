name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --noconsole --name Jarvis --collect-data speech_recognition --collect-data certifi jarvis_desktop.py
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pack | Out-Null
          Copy-Item dist/Jarvis.exe pack/
          Copy-Item macros.json pack/
          Compress-Archive -Path pack/* -DestinationPath Jarvis-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: Jarvis-Windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Jarvis-Windows.zip
